<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="t">
  <title id="t">Let's build something that ships.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfdbfe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="160" rx="14"/></clipPath>
    <style>
      .serif { font-family: 'Georgia', 'Times New Roman', serif; }
      .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .fade  { animation: fade 6s ease-in-out infinite; }
      .flare { transform-origin: 600px 100px; animation: flare 6s ease-in-out infinite; }
      @keyframes fade  { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes flare { 0%, 100% { transform: scaleX(0.4); opacity: 0.3; } 50% { transform: scaleX(1); opacity: 0.8; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="160" fill="#05070c"/>
    <rect width="1200" height="160" fill="url(#bg)"/>
    <text class="serif fade" x="600" y="84" text-anchor="middle" font-size="30" fill="#e5ecf6">Let’s build something that ships.</text>
    <rect class="flare" x="300" y="100" width="600" height="1.5" fill="url(#flare)"/>
    <text class="mono" x="600" y="128" text-anchor="middle" font-size="11" letter-spacing="5" fill="#6b7a93">FADE OUT</text>
  </g>
</svg>
